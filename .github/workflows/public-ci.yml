name: Public CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Public repository safety check
        run: python scripts/check_public_repo_safety.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Synthetic policy regression
        run: python evaluation/validate_public_synthetic.py

      - name: Public freeze check
        run: python evaluation/check_public_freeze.py
